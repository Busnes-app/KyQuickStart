name: CI

on:
  push:
    branches: [master]
  pull_request:
  # dependency-release.yml dispatches it on a catalog-follow commit, which its
  # GITHUB_TOKEN push does not trigger.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The binary runs on operator workstations, so macOS is in the matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # The release binaries must not depend on where, or from what, they are built: build them
      # with scripts/release-binaries.sh from this checkout and from a git archive copy (no .git)
      # in another directory, and require identical bytes. docs/VERIFYING-RELEASES.md shows users
      # how to repeat this against a release.
      - name: release binaries are repeatable
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: |
          set -euo pipefail
          pin="ghcr.io/busnes-app/kyquickstart-runner:0.0.0@sha256:$(printf '0%.0s' $(seq 64))"
          mkdir -p "$RUNNER_TEMP/elsewhere/src"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/elsewhere/src"
          sh scripts/release-binaries.sh 0.0.0 "$pin" "$RUNNER_TEMP/a"
          sh "$RUNNER_TEMP/elsewhere/src/scripts/release-binaries.sh" 0.0.0 "$pin" "$RUNNER_TEMP/elsewhere/b"
          (cd "$RUNNER_TEMP" && sha256sum a/* elsewhere/b/*)
          for f in "$RUNNER_TEMP"/a/*; do cmp "$f" "$RUNNER_TEMP/elsewhere/b/${f##*/}"; done
      - run: make ci
      # Bounded fuzzing on one leg only, about 15 s each; minimizing a large input is capped.
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -fuzz=FuzzParse -fuzztime=150000x -fuzzminimizetime=5s ./internal/stack
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -fuzz=FuzzRedact -fuzztime=600000x ./internal/engine
      - if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -fuzz=FuzzStartRequest -fuzztime=100000x -fuzzminimizetime=5s ./internal/runner

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make workflow-lint

  e2e-shard:
    # sshd in a container on the runner's Docker socket; deploys the hello fixture. Each kind
    # test builds its own cluster, so the suite splits by test name into parallel jobs, balanced
    # by measured time (2026-10-23, run 39970533462): the four kind-heavy tests take 33 of the
    # suite's 35.5 minutes. `rest` skips the named tests rather than listing the others, so a
    # new test runs there until it earns a shard.
    name: e2e (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: kube-npm-edge # 14.7 min
            run: ^TestKubernetesNPMEdge$
            pkgs: ./test/e2e/
          - shard: kube-message-apply # 10.3 min
            run: ^(TestKubernetesKyMessage|TestKubernetesApply)$
            pkgs: ./test/e2e/
          - shard: kube-restore-yard # 8.1 min
            run: ^(TestKubernetesRestore|TestKubernetesKyYard)$
            pkgs: ./test/e2e/
          - shard: rest # 3.5 min
            skip: ^(TestKubernetesNPMEdge|TestKubernetesKyMessage|TestKubernetesApply|TestKubernetesRestore|TestKubernetesKyYard)$
            pkgs: ./test/e2e/ ./internal/edge/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make e2e
        env:
          E2E_RUN: ${{ matrix.run }}
          E2E_SKIP: ${{ matrix.skip }}
          E2E_PKGS: ${{ matrix.pkgs }}

  e2e:
    # The one name release-image.yml's REQUIRED list (and anyone reading the checks) waits on:
    # green only when every shard passed. always() makes a failed or cancelled shard a red e2e,
    # not a skipped one, which would read as green.
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $RESULT"
          [ "$RESULT" = success ]

  image:
    # The suite runner image (Dockerfile); release-image.yml publishes it.
    name: Runner image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=0.0.0-ci -t kyquickstart-runner:ci .
      - name: Static binary as uid 10001, no shell
        run: |
          set -euo pipefail
          [ "$(docker image inspect -f '{{.Config.User}}' kyquickstart-runner:ci)" = 10001:10001 ]
          [ "$(docker run --rm --entrypoint kyquickstart kyquickstart-runner:ci version)" = 0.0.0-ci ]
          if docker run --rm --entrypoint sh kyquickstart-runner:ci -c true; then echo "the image has a shell" >&2; exit 1; fi
      - name: Serves read-only without capabilities
        run: |
          set -euo pipefail
          docker run -d --name runner --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v runner-state:/state -v runner-socket:/run/kyquickstart kyquickstart-runner:ci
          trap 'docker logs runner; docker rm -f runner' EXIT
          for _ in $(seq 30); do docker logs runner 2>&1 | grep -q ' serving on ' && break; sleep 1; done
          docker logs runner 2>&1 | grep -q ' serving on /run/kyquickstart/runner.sock'
          [ "$(docker top runner -o pid,uid | awk 'NR > 1 { print $2 }')" = 10001 ]
          docker exec runner kyquickstart serve-keygen --state /state | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/=]+ kyquickstart-runner [0-9a-f-]{36}$'
          docker stop -t 30 runner
          [ "$(docker inspect -f '{{.State.ExitCode}}' runner)" = 0 ]
