name: kydns
description: KyDNS, the suite's LAN DNS server; local names for every service, upstream resolution
category: ky
version: 0.5.0
# Release image of v0.4.2 (commit ca8d7723b4fc), attested by
# Busnes-app/KyDNS-server release.yml@refs/tags/v0.4.2 (gh attestation verify).
# catalog-follow: v0.5.0 attested by Busnes-app/KyDNS-server release.yml@refs/tags/v0.5.0
images:
  kydns: ghcr.io/busnes-app/kydns-server:0.5.0@sha256:84961a56b44b516aff750a210476b00cfb62c5726c59b40d2b29b88fd3de6866
# verify-edge reads the suite proxy contract here (clientIp, proxyHeadersTrusted, scheme).
status_path: /api/v1/installer/network
# The LAN's DNS administration: never on the public connection.
exposure: internal
# Its setup needs KyIdentity's issuer and client.
depends_on: [kyidentity]
# Docker only: LAN resolvers need port 53 itself, which restricted pods cannot bind, and its
# transport gate trusts one fixed edge address (docs/guided-setup.md, Catalog KyDNS on Docker).
health:
  timeout_seconds: 120
# Admin-only: KyIdentity refuses everyone but kydns.admin. Its setup names the administrator
# subject; the signed directory webhook revokes it. No SCIM, no everyday role.
oidc:
  name: KyDNS
  redirect_paths: [/auth/sso/callback]
  admin_role: kydns.admin
  directory_path: /api/v1/installer/directory
# kydns.db, its setup token and the installer's files.
backup:
  volumes: [data]
upgrade:
  # 0.5.0 adds no migration (sessions stay in memory), but an install from 0.4.2 still migrates
  # its SQLite schema at startup.
  min_from: 0.4.2
  migrates_data: true
