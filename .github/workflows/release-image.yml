name: publish release image

# A published release vX.Y.Z publishes the suite runner's immutable :X.Y.Z image and
# attests and verifies it (publish), builds the kyquickstart binaries pinned to that digest
# and attests, uploads and re-verifies them (binaries), then moves :stable (promote). Each
# job holds only the permissions it uses. Image steps copied from KyYard's release-image.yml.
on:
  release:
    types: [published]

# Serialised so two releases cannot race to move :stable. Never cancelled: a run
# that pushed :X.Y.Z must finish attesting it.
concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      IMAGE_NAME: ghcr.io/busnes-app/kyquickstart-runner
    # Read only after this job succeeds, so only after the attestation verified.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.value }}
    steps:
      # Red, not skipped: a skipped job is green and leaves a release with no image.
      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::release tag must be v<major>.<minor>.<patch>, got: $TAG" >&2
            exit 1
          fi
          echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      # A branch named like the tag must not stand in for it: build only the
      # commit this release event names.
      - name: Require the checkout to be the released commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$head" != "$want" ]; then
            echo "::error::checked out $head, but the release names $want" >&2
            exit 1
          fi

      # The binary's only version source is main.version, stamped from the tag at build
      # time (VERSION build arg below); the built image is checked against the tag before
      # it is attested. A constant here would be a second source to disagree. Likewise
      # main.runnerImage: only the binaries job stamps it, with this run's digest.
      - name: Require the version source to be the build stamp
        run: |
          set -euo pipefail
          grep -qx 'var version = "dev"' cmd/kyquickstart/main.go || {
            echo "::error::cmd/kyquickstart/main.go must keep var version = \"dev\" for the release stamp" >&2
            exit 1
          }
          grep -qx 'var runnerImage = ""' cmd/kyquickstart/main.go || {
            echo "::error::cmd/kyquickstart/main.go must keep var runnerImage = \"\" for the release stamp" >&2
            exit 1
          }

      # Provenance says where an image came from, not that it works. Check the
      # commit actually checked out (for an annotated tag GITHUB_SHA can name the
      # tag object), and require every ci.yml job by name: a cancelled or skipped
      # job must not read as a pass. filter=latest lets a re-run supersede its
      # original; only GitHub Actions' own check runs count.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One ci.yml job name per line, as the check runs report them.
          REQUIRED: |
            test (ubuntu-latest, 1.26.x)
            test (ubuntu-latest, stable)
            test (macos-latest, 1.26.x)
            test (macos-latest, stable)
            vulncheck
            e2e
            Runner image build & run
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "tagged commit: $sha"
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          printf 'check runs for this commit:\n%s\n' "${runs:-<none>}"

          missing=""
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            rows="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j { print $2 "/" $3 }')"
            if [ -z "$rows" ]; then
              missing="$missing [$job](absent)"
            elif bad="$(printf '%s\n' "$rows" | grep -v '^completed/success$')"; then
              missing="$missing [$job]($(printf '%s' "$bad" | tr '\n' ','))"
            fi
          done <<< "$REQUIRED"

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish $sha: CI did not pass for it:$missing" >&2
            echo "Let ci.yml finish green on this commit (push to master or open a PR) before releasing." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Only the immutable tag here. :stable moves after the attestation verifies,
      # so a failed attest never leaves :stable on an unattested image.
      - name: Build and publish the immutable version tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true

      # Run the pushed bytes, not the local build cache.
      - name: Require the image to report the tag's version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          got="$(docker run --rm --entrypoint kyquickstart "$IMAGE_NAME@$DIGEST" version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the image reports release set $got, the tag is $VERSION" >&2
            exit 1
          fi

      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Verified the way an operator would, pinned to this workflow at this tag.
      - name: Verify the attestation before promoting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG"

  # The four binaries carry the verified digest in main.runnerImage, so a release binary
  # installs KyYard with exactly the runner it was released with. Nothing is uploaded
  # before its stamp and attestation check out; the uploaded bytes are checked again.
  binaries:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the attestations
      attestations: write
    env:
      PIN: ghcr.io/busnes-app/kyquickstart-runner:${{ needs.publish.outputs.version }}@${{ needs.publish.outputs.digest }}
      VERSION: ${{ needs.publish.outputs.version }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Require the checkout to be the released commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$head" != "$want" ]; then
            echo "::error::checked out $head, but the release names $want" >&2
            exit 1
          fi

      # No build cache: a release binary is built from the tag alone.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the release binaries
        run: sh scripts/release-binaries.sh "$VERSION" "$PIN" dist

      # -trimpath keeps -ldflags out of the build info, so the stamp is checked in the bytes
      # and, on the binary this runner can execute, in its output.
      - name: Require every binary to carry this run's pin
        run: |
          set -euo pipefail
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            f="dist/kyquickstart-$VERSION-$p"
            info="$(go version -m "$f")"
            for want in "GOOS=${p%-*}" "GOARCH=${p#*-}" "-trimpath=true" "CGO_ENABLED=0"; do
              printf '%s\n' "$info" | grep -qF "$want" || { echo "::error::$f: no $want" >&2; exit 1; }
            done
            grep -qF "$PIN" "$f" || { echo "::error::$f does not carry $PIN" >&2; exit 1; }
          done
          f="dist/kyquickstart-$VERSION-linux-amd64"
          [ "$("$f" version)" = "$VERSION" ] || { echo "::error::$f version is not $VERSION" >&2; exit 1; }
          [ "$("$f" version --runner-image)" = "$PIN" ] || { echo "::error::$f version --runner-image is not $PIN" >&2; exit 1; }

      - name: Publish GitHub binary attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kyquickstart-*

      # GH_TOKEN (contents: write) only on the steps that run gh.
      - name: Verify the attestations before uploading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in dist/kyquickstart-*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG" ||
              { echo "::error::the attestation for $f did not verify" >&2; exit 1; }
          done

      # --clobber: a re-run replaces this run's own assets.
      - name: Upload the binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/kyquickstart-* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the uploaded binaries
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded --pattern 'kyquickstart-*'
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            f="downloaded/kyquickstart-$VERSION-$p"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG" ||
              { echo "::error::the attestation for uploaded $f did not verify" >&2; exit 1; }
            info="$(go version -m "$f")"
            for want in "GOOS=${p%-*}" "GOARCH=${p#*-}"; do
              printf '%s\n' "$info" | grep -qF "$want" || { echo "::error::uploaded $f: no $want" >&2; exit 1; }
            done
            grep -qF "$PIN" "$f" || { echo "::error::uploaded $f does not carry $PIN" >&2; exit 1; }
          done

      # Bytes that failed the check must not stay on the release.
      - name: Remove the uploaded binaries after a failed check
        if: failure() && steps.recheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            gh release delete-asset "$TAG" "kyquickstart-$VERSION-$p" --repo "$GITHUB_REPOSITORY" --yes ||
              echo "::error::could not delete kyquickstart-$VERSION-$p from $TAG; delete it by hand" >&2
          done
          exit 1

  # :stable moves only after the image and all four binaries verified.
  promote:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # move :stable
      attestations: read
    env:
      IMAGE_NAME: ghcr.io/busnes-app/kyquickstart-runner
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # :stable only moves forward, and never to a prerelease: publishing a patch
      # for an old line must not downgrade everyone following :stable.
      - name: Decide whether this release may move stable
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::$VERSION is a prerelease; :stable stays where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed lookup must stop here: an empty list would make this release "highest".
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          published="$(printf '%s\n' "$tags" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          highest="$(printf '%s\n%s\n' "$published" "$VERSION" | sort -V | tail -n1)"
          echo "highest published release: $highest; this release: $VERSION"
          if [ "$highest" != "$VERSION" ]; then
            echo "::notice::$VERSION is older than $highest; :stable stays where it is"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      # By digest, as a carbon copy (--prefer-index=false), then asserted and
      # verified on the tag operators actually pull.
      - name: Promote the verified digest to stable
        if: steps.promote.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:stable" "$IMAGE_NAME@$DIGEST"
          stable="$(docker buildx imagetools inspect "$IMAGE_NAME:stable" --format '{{.Manifest.Digest}}')"
          if [ "$stable" != "$DIGEST" ]; then
            echo "::error:::stable resolves to $stable, attested digest is $DIGEST" >&2
            exit 1
          fi
          gh attestation verify "oci://$IMAGE_NAME:stable" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-image.yml@refs/tags/$TAG"
          echo "Published \`$IMAGE_NAME@$DIGEST\` as \`:$VERSION\` and \`:stable\`" >> "$GITHUB_STEP_SUMMARY"
