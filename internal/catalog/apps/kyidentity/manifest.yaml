name: kyidentity
description: KyIdentity, the suite's identity provider (OIDC, MFA, SCIM); every other app signs in through it
category: ky
version: 0.5.0.2
# No status_path yet: 0.4.7 serves the suite proxy contract at /api/installer/network
# (KyIdentity-server#141), but reports proxyHeadersTrusted only for a peer in TRUSTED_PROXY_CIDRS,
# which only its Compose file sets (to the edge's address), so verify-edge would fail its
# Kubernetes route. verify-edge skips it.
# Release image of v0.4.7, attested by release-image.yml@refs/tags/v0.4.7 (gh attestation verify;
# source commit 84ba819 = v0.4.7^{commit}). It advertises setup amendments, disable-user,
# resync-system (its resync replays removals, which kyquickstart restore requires),
# installer-verified-email (MAS's chat sign-in needs it) and mail-relay. 0.4.6 sends a removal
# made before the person's first delivery instead of dropping it; 0.4.7 never gives up on one.
# catalog-follow: v0.5.0.2 attested by Busnes-app/KyIdentity-server release-image.yml@refs/tags/v0.5.0.2
images:
  kyidentity: ghcr.io/busnes-app/kyidentity-server:0.5.0.2@sha256:f6778601b89ae2c05de53e1a34f7832060484529d224236ef97ec27bd14ba91b
health:
  timeout_seconds: 300
# Its signing, session and encryption keys are generated in the data directory on first start.
backup:
  volumes: [data]
upgrade:
  # Migrations run at startup; the release notes cover upgrades from 0.4.x only. 0.4.4 to 0.5.0
  # add at most one defaulted column (0.4.6) and one-time status corrections; none rewrites
  # people, access or content, so an upgrade needs only an acknowledgement.
  min_from: 0.4.0
  migrates_data: false
  note: >-
    KyIdentity 0.4.5 and earlier dropped a removal made before a person's first delivery to an
    app, with no record a resync can replay: check each app's accounts for people disabled or
    unassigned right after being given access.
kubernetes:
  image: kyidentity
  env:
    KYIDENTITY_BACKUP_ALLOW_PRIVATE_RECOVERY: "{{private_recovery}}"
    KYIDENTITY_ISSUER_URL: https://{{host}}
    KYIDENTITY_DATA_DIR: /data
    KYIDENTITY_PORT: "5867"
    # The first-start administrator, kept apart from the owner's accounts apply-setup creates.
    BOOTSTRAP_ADMIN_USER: kyq-bootstrap
    # Its SCIM and directory connectors deliver to the suite's apps through their routes, which
    # resolve to the edge's LAN or pod address; KyIdentity refuses private destinations without
    # this. It opens RFC 1918, ULA and carrier-grade NAT only: loopback, link-local and cloud
    # metadata addresses stay refused, and device-supplied push endpoints never get it.
    KYIDENTITY_ALLOW_PRIVATE_CALLBACKS: "true"
    # Argon2id takes 64 MiB per hash, up to 8 at once; stay under the limit.
    GOMEMLIMIT: 640MiB
  ports: [5867]
  readiness_path: /readyz
  run_as: 100
  resources:
    cpu: "1"
    # Idle between Argon2id bursts: reserve little, burst to the limit.
    cpu_request: 100m
    memory: 768Mi
  volumes:
    - name: data
      mount: /data
      size: 1Gi
