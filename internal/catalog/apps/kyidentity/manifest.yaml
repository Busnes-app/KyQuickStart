name: kyidentity
description: KyIdentity, the suite's identity provider (OIDC, MFA, SCIM); every other app signs in through it
category: ky
version: 0.4.6
# No status_path: 0.4.6 does not report the suite proxy contract (KyIdentity-server#140),
# so verify-edge skips its route.
# Release image of v0.4.6, attested by release-image.yml@refs/tags/v0.4.6 (gh attestation verify;
# source commit f647faf = v0.4.6^{commit}). It advertises setup amendments, disable-user,
# resync-system (its resync replays removals, which kyquickstart restore requires),
# installer-verified-email (MAS's chat sign-in needs it) and mail-relay. 0.4.6 sends a removal
# made before the person's first delivery instead of dropping it.
images:
  kyidentity: ghcr.io/busnes-app/kyidentity-server:0.4.6@sha256:2136581c85c66c354c5cfbe84a209832f020410d1835890f0ec3382256e1ed67
health:
  timeout_seconds: 300
# Its signing, session and encryption keys are generated in the data directory on first start.
backup:
  volumes: [data]
upgrade:
  # Migrations run at startup; the release notes cover upgrades from 0.4.x only. 0.4.4 and 0.4.5
  # change no schema; 0.4.6 adds one defaulted column and flags an unchanged bootstrap password
  # (once), rewriting no existing data, so an upgrade needs only an acknowledgement.
  min_from: 0.4.0
  migrates_data: false
  note: >-
    KyIdentity 0.4.5 and earlier dropped a removal made before a person's first delivery to an
    app, with no record a resync can replay: check each app's accounts for people disabled or
    unassigned right after being given access.
kubernetes:
  image: kyidentity
  env:
    KYIDENTITY_ISSUER_URL: https://{{host}}
    KYIDENTITY_DATA_DIR: /data
    KYIDENTITY_PORT: "5867"
    # The first-start administrator, kept apart from the owner's accounts apply-setup creates.
    BOOTSTRAP_ADMIN_USER: kyq-bootstrap
    # Its SCIM and directory connectors deliver to the suite's apps through their routes, which
    # resolve to the edge's LAN or pod address; KyIdentity refuses private destinations without
    # this. It opens RFC 1918, ULA and carrier-grade NAT only: loopback, link-local and cloud
    # metadata addresses stay refused, and device-supplied push endpoints never get it.
    KYIDENTITY_ALLOW_PRIVATE_CALLBACKS: "true"
    # Argon2id takes 64 MiB per hash, up to 8 at once; stay under the limit.
    GOMEMLIMIT: 640MiB
  ports: [5867]
  readiness_path: /readyz
  run_as: 100
  resources:
    cpu: "1"
    # Idle between Argon2id bursts: reserve little, burst to the limit.
    cpu_request: 100m
    memory: 768Mi
  volumes:
    - name: data
      mount: /data
      size: 1Gi
