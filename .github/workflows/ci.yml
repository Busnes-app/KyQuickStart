name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The binary runs on operator workstations, so macOS is in the matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: make ci

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make workflow-lint

  e2e:
    # sshd in a container on the runner's Docker socket; deploys the hello fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: make e2e

  image:
    # The suite runner image (Dockerfile); release-image.yml publishes it.
    name: Runner image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=0.0.0-ci -t kyquickstart-runner:ci .
      - name: Static binary as uid 10001, no shell
        run: |
          set -euo pipefail
          [ "$(docker image inspect -f '{{.Config.User}}' kyquickstart-runner:ci)" = 10001:10001 ]
          [ "$(docker run --rm --entrypoint kyquickstart kyquickstart-runner:ci version)" = 0.0.0-ci ]
          if docker run --rm --entrypoint sh kyquickstart-runner:ci -c true; then echo "the image has a shell" >&2; exit 1; fi
      - name: Serves read-only without capabilities
        run: |
          set -euo pipefail
          docker run -d --name runner --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v runner-state:/state -v runner-socket:/run/kyquickstart kyquickstart-runner:ci
          trap 'docker logs runner; docker rm -f runner' EXIT
          for _ in $(seq 30); do docker logs runner 2>&1 | grep -q ' serving on ' && break; sleep 1; done
          docker logs runner 2>&1 | grep -q ' serving on /run/kyquickstart/runner.sock'
          [ "$(docker top runner -o pid,uid | awk 'NR > 1 { print $2 }')" = 10001 ]
          docker exec runner kyquickstart serve-keygen --state /state | grep -Eq '^ssh-ed25519 [A-Za-z0-9+/=]+ kyquickstart-runner [0-9a-f-]{36}$'
          docker stop -t 30 runner
          [ "$(docker inspect -f '{{.State.ExitCode}}' runner)" = 0 ]

  kyoffboard-image:
    # The offboarding bridge image (cmd/kyoffboard/Dockerfile); kyoffboard-image.yml publishes it.
    name: kyoffboard image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          set -euo pipefail
          docker build -f cmd/kyoffboard/Dockerfile --build-arg VERSION=0.0.0-ci --build-arg REVISION="$GITHUB_SHA" -t kyoffboard:ci .
          # The cached build stage, used only to hand the fixture to uid 65532 without sudo.
          docker build -f cmd/kyoffboard/Dockerfile --target build -t kyoffboard-build:ci .
      - name: Static binary as uid 65532, no shell
        run: |
          set -euo pipefail
          [ "$(docker image inspect -f '{{.Config.User}}' kyoffboard:ci)" = 65532:65532 ]
          [ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' kyoffboard:ci)" = "$GITHUB_SHA" ]
          [ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' kyoffboard:ci)" = 0.0.0-ci ]
          if docker run --rm --entrypoint /bin/sh kyoffboard:ci -c true; then echo "the image has a shell" >&2; exit 1; fi
      # A 0700 config directory and 0600 files owned by the service uid, a separate state
      # directory, and a TLS leaf (serverAuth, not a CA) from a throwaway CA.
      - name: Protected fixture configuration
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/kyoffboard"
          mkdir -m 0700 "$f" "$f/ca" "$f/config" "$f/state"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=kyoffboard-ci-ca -days 1 \
            -keyout "$f/ca/ca-key.pem" -out "$f/ca/ca.pem" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=localhost \
            -keyout "$f/config/server-key.pem" -out "$f/ca/server.csr" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'extendedKeyUsage=serverAuth' 'subjectAltName=DNS:localhost' > "$f/ca/server.ext"
          openssl x509 -req -in "$f/ca/server.csr" -CA "$f/ca/ca.pem" -CAkey "$f/ca/ca-key.pem" -CAcreateserial -days 1 \
            -extfile "$f/ca/server.ext" -out "$f/config/server.pem" 2>/dev/null
          openssl rand -hex 32 > "$f/config/product-token"
          openssl rand -hex 32 > "$f/config/scim-token"
          cat > "$f/config/config.json" <<'EOF'
          {"schema":"ky.offboarding-runtime/1","setup_id":"271333e2-c221-4601-b249-563b3d828530","listen":"0.0.0.0:8443","state_dir":"/state","cert_file":"server.pem","key_file":"server-key.pem","apps":[{"app":"wiki","kind":"bookstack","origin":"https://wiki.example.test","issuer":"https://identity.example.test","product_token_file":"product-token","scim_token_file":"scim-token"}]}
          EOF
          chmod 0600 "$f/config/"*
          docker run --rm -v "$f/config:/c" -v "$f/state:/s" kyoffboard-build:ci chown -R 65532:65532 /c /s
      - name: Checks the protected configuration read-only without capabilities
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/kyoffboard"
          out="$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$f/config:/config:ro" -v "$f/state:/state" kyoffboard:ci --config /config/config.json --check)"
          [ "$out" = '{"schema":"ky.offboarding-runtime/1","status":"valid","applications":1}' ]
      - name: Serves TLS, refuses unauthenticated SCIM, stops cleanly
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/kyoffboard"
          docker run -d --name kyoffboard-ci --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1::8443 \
            -v "$f/config:/config:ro" -v "$f/state:/state" kyoffboard:ci --config /config/config.json
          trap 'docker logs kyoffboard-ci; docker rm -f kyoffboard-ci' EXIT
          port="$(docker port kyoffboard-ci 8443/tcp | head -n1 | sed 's/.*://')"
          scim=(curl -sS -o /dev/null -w '%{http_code}' --cacert "$f/ca/ca.pem" --resolve "localhost:$port:127.0.0.1" "https://localhost:$port/scim/wiki/Users")
          for _ in $(seq 30); do "${scim[@]}" >/dev/null 2>&1 && break; sleep 1; done
          [ "$("${scim[@]}")" = 401 ]
          [ "$(docker top kyoffboard-ci -o pid,uid | awk 'NR > 1 { print $2 }')" = 65532 ]
          docker stop -t 30 kyoffboard-ci
          [ "$(docker inspect -f '{{.State.ExitCode}}' kyoffboard-ci)" = 0 ]
