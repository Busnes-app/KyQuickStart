name: publish Immich server image

# A pushed tag immich-v3.2.0-ky.<n> publishes the catalog's Immich server, upstream v3.2.0
# with this repository's AGPL module (internal/adapters/immich/module), as the immutable
# ghcr.io/busnes-app/kyq-immich-server:3.2.0-ky.<n>, then attests and verifies it.
# Guards copied from kyoffboard-image.yml.
on:
  push:
    tags: ['immich-v*']

# Never cancelled: a run that pushed the tag must finish attesting it.
concurrency:
  group: immich-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      IMAGE_NAME: ghcr.io/busnes-app/kyq-immich-server
      TAG: ${{ github.ref_name }}
      UPSTREAM: https://github.com/immich-app/immich.git
      UPSTREAM_TAG: v3.2.0
      UPSTREAM_COMMIT: 1b6098c9dbfffe978bec2d414606ed7a4c8e019a
      # node:24.15.0-bookworm-slim, linux/amd64 (upstream mise.toml pins node 24.15.0, pnpm 11.22.0)
      NODE_IMAGE: node@sha256:152aceace5c03e2597988763165ee33e3fd3633636db0fc983cd2e126b02cfde
      BASE: ghcr.io/immich-app/immich-server@sha256:949bbf9ff32543539f471bc275437e6d1a1a4fee43c55bb9e4c06b946909bf1c
    steps:
      # Red, not skipped: a skipped job is green and leaves a tag with no image.
      - name: Validate tag version
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^immich-v(3\.2\.0-ky\.[1-9][0-9]*)$ ]]; then
            echo "::error::tag must be immich-v3.2.0-ky.<n>, got: $TAG" >&2
            exit 1
          fi
          echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Require the checkout to be the tagged commit
        id: commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse "$GITHUB_SHA^{commit}")"
          tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$head" != "$want" ] || [ "$tagged" != "$want" ]; then
            echo "::error::checked out $head, tag $TAG is $tagged, the push names $want" >&2
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          REQUIRED: |
            test (ubuntu-latest, 1.26.x)
            test (ubuntu-latest, stable)
            test (macos-latest, 1.26.x)
            test (macos-latest, stable)
            vulncheck
            e2e
            Runner image build & run
            kyoffboard image build & run
        run: |
          set -euo pipefail
          echo "tagged commit: $SHA"
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          printf 'check runs for this commit:\n%s\n' "${runs:-<none>}"

          missing=""
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            rows="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j { print $2 "/" $3 }')"
            if [ -z "$rows" ]; then
              missing="$missing [$job](absent)"
            elif bad="$(printf '%s\n' "$rows" | grep -v '^completed/success$')"; then
              missing="$missing [$job]($(printf '%s' "$bad" | tr '\n' ','))"
            fi
          done <<< "$REQUIRED"

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish $SHA: CI did not pass for it:$missing" >&2
            exit 1
          fi

      # Only the pinned commit, and only if upstream's tag still names it.
      - name: Fetch upstream and verify its commit
        run: |
          set -euo pipefail
          # A lightweight tag: its ref is the commit.
          tagged="$(git ls-remote "$UPSTREAM" "refs/tags/$UPSTREAM_TAG" | cut -f1)"
          if [ "$tagged" != "$UPSTREAM_COMMIT" ]; then
            echo "::error::upstream $UPSTREAM_TAG is [$tagged], expected $UPSTREAM_COMMIT" >&2
            exit 1
          fi
          git init -q upstream
          git -C upstream sparse-checkout set server packages
          git -C upstream fetch -q --depth 1 "$UPSTREAM" "$UPSTREAM_COMMIT"
          git -C upstream checkout -q --detach FETCH_HEAD
          head="$(git -C upstream rev-parse HEAD)"
          if [ "$head" != "$UPSTREAM_COMMIT" ]; then
            echo "::error::fetched $head, expected $UPSTREAM_COMMIT" >&2
            exit 1
          fi
          echo "upstream commit verified: $head"

      - name: Check and apply the module patch
        id: patch
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/internal/adapters/immich/module/source.patch"
          sum="$(sha256sum "$patch" | cut -d' ' -f1)"
          want="$(cat internal/adapters/immich/module/source.patch.sha256)"
          if [ "$sum" != "$want" ]; then
            echo "::error::source.patch is $sum, source.patch.sha256 records $want" >&2
            exit 1
          fi
          git -C upstream apply --check "$patch"
          git -C upstream apply "$patch"
          echo "source.patch sha256 $sum applies to $UPSTREAM_COMMIT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      # Upstream's order: SDK, plugin SDK, then the server. Built in the pinned Node image
      # as the runner user, with upstream's frozen lockfile and no install scripts.
      - name: Build the server in upstream's order
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e COREPACK_HOME=/tmp/corepack \
            -e NODE_OPTIONS=--max-old-space-size=4096 -v "$GITHUB_WORKSPACE/upstream:/src" -w /src "$NODE_IMAGE" sh -euc '
              pnpm() { corepack pnpm@11.22.0 "$@"; }
              pnpm --filter "immich..." install --frozen-lockfile --ignore-scripts
              pnpm --filter @immich/sdk build
              pnpm --filter @immich/plugin-sdk build
              pnpm --dir server exec tsc --noEmit
              pnpm --filter immich build'
          test -f upstream/server/dist/main.js

      - name: Require the overlay's pinned base
        run: |
          set -euo pipefail
          from="$(grep '^FROM ' internal/adapters/immich/module/Dockerfile)"
          echo "$from"
          if [ "$from" != "FROM $BASE" ]; then
            echo "::error::the overlay must build FROM $BASE" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the immutable version tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: upstream/server
          file: internal/adapters/immich/module/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: |
            KYQ_SOURCE_PATCH_SHA256=${{ steps.patch.outputs.sha256 }}
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ steps.commit.outputs.sha }}
            SOURCE_TAG=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Require the image labels to name the tag, source and patch
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          SHA: ${{ steps.commit.outputs.sha }}
          PATCH: ${{ steps.patch.outputs.sha256 }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE_NAME@$DIGEST"
          label() { docker image inspect -f "{{index .Config.Labels \"$1\"}}" "$IMAGE_NAME@$DIGEST"; }
          if [ "$(label org.opencontainers.image.version)" != "$VERSION" ] || [ "$(label org.opencontainers.image.revision)" != "$SHA" ] ||
            [ "$(label kyq.immich-access.source)" != "$UPSTREAM_COMMIT" ] || [ "$(label kyq.immich-access.patch-sha256)" != "$PATCH" ]; then
            echo "::error::labels do not name $VERSION at $SHA, source $UPSTREAM_COMMIT, patch $PATCH" >&2
            exit 1
          fi

      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          commits="$(gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/immich-image.yml@refs/tags/$TAG" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit')"
          want="$(git rev-parse "$TAG^{commit}")"
          if [ -z "$commits" ] || [ "$(printf '%s\n' "$commits" | sort -u)" != "$want" ]; then
            echo "::error::attested gitCommit is [$commits], $TAG is $want" >&2
            exit 1
          fi
          echo "Published \`$IMAGE_NAME@$DIGEST\` as \`:${TAG#immich-v}\` from $want" >> "$GITHUB_STEP_SUMMARY"
