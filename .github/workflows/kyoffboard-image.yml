name: publish kyoffboard image

# A pushed tag kyoffboard-vX.Y.Z publishes the offboarding bridge's immutable
# ghcr.io/busnes-app/kyoffboard:X.Y.Z, then attests and verifies it. No moving tag:
# deployments pin the attested digest. Guards copied from release-image.yml.
on:
  push:
    tags: ['kyoffboard-v*']

# Never cancelled: a run that pushed :X.Y.Z must finish attesting it.
concurrency:
  group: kyoffboard-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: read
    env:
      IMAGE_NAME: ghcr.io/busnes-app/kyoffboard
      TAG: ${{ github.ref_name }}
    steps:
      # Red, not skipped: a skipped job is green and leaves a tag with no image.
      - name: Validate tag version
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^kyoffboard-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag must be kyoffboard-v<major>.<minor>.<patch>, got: $TAG" >&2
            exit 1
          fi
          echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      # A branch named like the tag must not stand in for it: build only the
      # commit this push names, which must be the tag's commit.
      - name: Require the checkout to be the tagged commit
        id: commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          want="$(git rev-parse "$GITHUB_SHA^{commit}")"
          tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$head" != "$want" ] || [ "$tagged" != "$want" ]; then
            echo "::error::checked out $head, tag $TAG is $tagged, the push names $want" >&2
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      # Provenance says where an image came from, not that it works. Require every
      # ci.yml job by name: a cancelled or skipped job must not read as a pass.
      # filter=latest lets a re-run supersede its original; only GitHub Actions'
      # own check runs count.
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          # One ci.yml job name per line, as the check runs report them.
          REQUIRED: |
            test (ubuntu-latest, 1.26.x)
            test (ubuntu-latest, stable)
            test (macos-latest, 1.26.x)
            test (macos-latest, stable)
            vulncheck
            e2e
            Runner image build & run
            kyoffboard image build & run
        run: |
          set -euo pipefail
          echo "tagged commit: $SHA"
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.name)\t\(.status)\t\(.conclusion // "none")"')"
          printf 'check runs for this commit:\n%s\n' "${runs:-<none>}"

          missing=""
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            rows="$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" '$1 == j { print $2 "/" $3 }')"
            if [ -z "$rows" ]; then
              missing="$missing [$job](absent)"
            elif bad="$(printf '%s\n' "$rows" | grep -v '^completed/success$')"; then
              missing="$missing [$job]($(printf '%s' "$bad" | tr '\n' ','))"
            fi
          done <<< "$REQUIRED"

          if [ -n "$missing" ]; then
            echo "::error::refusing to publish $SHA: CI did not pass for it:$missing" >&2
            echo "Let ci.yml finish green on this commit (push to master or open a PR) before tagging." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the immutable version tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/kyoffboard/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ steps.commit.outputs.sha }}
          provenance: mode=max
          sbom: true

      # Inspect the pushed bytes, not the local build cache.
      - name: Require the image labels to name the tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE_NAME@$DIGEST"
          label() { docker image inspect -f "{{index .Config.Labels \"org.opencontainers.image.$1\"}}" "$IMAGE_NAME@$DIGEST"; }
          if [ "$(label version)" != "$VERSION" ] || [ "$(label revision)" != "$SHA" ]; then
            echo "::error::the image is labelled $(label version) at $(label revision), the tag is $VERSION at $SHA" >&2
            exit 1
          fi

      - name: Publish GitHub image attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Verified the way an operator would: pinned to this workflow at this tag, and
      # the SLSA v1 predicate's source commit must be the tag's commit.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          commits="$(gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/kyoffboard-image.yml@refs/tags/$TAG" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit')"
          want="$(git rev-parse "$TAG^{commit}")"
          if [ -z "$commits" ] || [ "$(printf '%s\n' "$commits" | sort -u)" != "$want" ]; then
            echo "::error::attested gitCommit is [$commits], $TAG is $want" >&2
            exit 1
          fi
          echo "Published \`$IMAGE_NAME@$DIGEST\` as \`:${TAG#kyoffboard-v}\` from $want" >> "$GITHUB_STEP_SUMMARY"
