name: kydrive
description: KyDrive, the suite's drive; personal and group workspaces for files and documents
category: ky
version: 0.4.2
# Release image of v0.4.2 (commit 850440753b96), attested by
# Busnes-app/kydrive-server release-image.yml@refs/tags/v0.4.2 (gh attestation verify).
images:
  kydrive: ghcr.io/busnes-app/kydrive-server:0.4.2@sha256:1b2eec75dd4d197934c98f109ff8f913b4025f39eda1e56b0076cd70428b3e2c
# Generated on the target. The session secret signs sessions; the SCIM token is the bearer
# KyIdentity's SCIM connector must present, and KyDrive's setup refuses to run without one.
secrets: [session_secret, scim_token]
# Its setup needs KyIdentity's issuer and client.
depends_on: [kyidentity]
health:
  timeout_seconds: 300
# KyDrive grants administration from its setup bundle, not from a claim; the roles are
# KyIdentity's assignments. It refuses a signed directory webhook: people and groups arrive
# by SCIM. Sign-out is local.
oidc:
  name: KyDrive
  redirect_paths: [/api/sso/kysignon/callback]
  admin_role: kydrive.admin
  user_role: kydrive.user
  scim_token_file: /run/secrets/scim_token
# The database, its encryption.key and the stored files are all in data; backups holds
# KyDrive's own sealed capsules. SQLite has no dump command here, so kyquickstart backup
# stops KyDrive while restic reads (cold).
backup:
  volumes: [data, backups]
  capsule_secrets: [session_secret, scim_token]
upgrade:
  # First catalog release; its SQLite schema migrates at startup.
  min_from: 0.4.2
  migrates_data: true
