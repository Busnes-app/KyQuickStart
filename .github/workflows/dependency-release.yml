name: dependency release

# Once a day, if Dependabot changes have landed on master since the last release
# on the current line, publish the next fourth-number release: v0.4.1 -> v0.4.1.1
# -> v0.4.1.2. However many Dependabot PRs merged that day, the day gets one
# release. Running it by hand releases master now, Dependabot or not, so a fix
# can ship without waiting for the schedule.
#
# First it follows the Ky apps: scripts/catalog-follow moves each catalog pin to
# the newest attested patch or .N release on the pin's MAJOR.MINOR line, and any
# change is tested, committed as github-actions[bot] ("catalog: follow ...") to the
# catalog-follow branch, and opened as a pull request: master's ruleset takes
# changes only through a PR with green checks. ci.yml runs on the branch, the PR
# merges when it passes, and ci.yml runs again on the merge commit, whose result
# the release gate reads. A red run leaves the PR open; tomorrow force-pushes a
# fresh follow onto it. A followed app counts like a Dependabot change, so a
# KyQuickStart release carries the newest app releases. A newer MAJOR.MINOR only
# warns: its upgrade rules need a human PR.
#
# The line (X.Y.Z) is internal/appversion/VERSION. A bumped line is released by
# hand first (publish vX.Y.Z); until then this workflow releases nothing. The
# fourth number lives only in the tag, and release-image.yml builds it into the
# runner image and the release binaries.
on:
  schedule:
    # After every Ky app's own dependency release, whose releases it follows.
    - cron: "53 23 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # ci.yml's e2e job alone takes about 40 minutes, and a follow runs it twice.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      # No build cache: what is pushed to master is built from master alone.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # An app whose release does not resolve or verify keeps its pin (a warning).
      - name: Follow the Ky apps' releases
        id: follow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bumps="$(go run ./scripts/catalog-follow)"
          if [ -z "$bumps" ]; then
            echo "every Ky app is at its newest release on its line"
            exit 0
          fi
          printf 'following:\n%s\n' "$bumps"
          if ! go test -count=1 ./internal/catalog/... || ! go build ./...; then
            echo "::warning::the followed catalog fails its tests or build; nothing pushed"
            git checkout -- internal/catalog/apps
            exit 0
          fi
          subject="catalog: follow $(printf '%s\n' "$bumps" | awk '{ printf "%s%s v%s", sep, $1, $3; sep = ", " }')"
          body="$(printf '%s\n' "$bumps" | awk '{ print $1 ": " $2 " -> " $3 }')"
          git add internal/catalog/apps
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$subject" -m "$body" -m "Each pin is the digest its release workflow attested (scripts/catalog-follow)."
          # Force: the branch only ever holds the newest follow, one commit on master.
          branch=catalog-follow
          if ! git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"; then
            echo "::warning::could not push $branch; nothing followed, tomorrow retries"
            git reset -q --hard HEAD~1
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base master --state open \
            --json number --jq '.[0].number // empty')"
          pr_body="$(printf '%s\n\nOpened by dependency-release.yml; it merges this PR itself once ci.yml passes.\n' "$body")"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$subject" --body "$pr_body"
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --title "$subject" --body "$pr_body")"
            pr="${url##*/}"
          fi
          printf 'sha=%s\npr=%s\n' "$sha" "$pr" >> "$GITHUB_OUTPUT"
          { echo "Opened \`$subject\` as #$pr (\`$sha\`):"; printf '%s\n' "$body" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

      # A GITHUB_TOKEN push or PR starts no workflow, but a dispatch does. ci.yml on
      # the branch head supplies the PR's required checks; ci.yml on the merge commit
      # supplies the check runs release-image.yml's REQUIRED gate reads, and the next
      # step judges that run's outcome.
      - name: Merge the followed catalog
        if: steps.follow.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.follow.outputs.sha }}
          PR: ${{ steps.follow.outputs.pr }}
        run: |
          set -euo pipefail
          # Dispatches ci.yml on ref $1 and prints the conclusion of its run on commit $2.
          ci_on() {
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$1" >&2
            local id=""
            for _ in $(seq 30); do
              sleep 10
              id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_dispatch --commit "$2" \
                --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [ -z "$id" ] || break
            done
            if [ -z "$id" ]; then
              echo absent
              return
            fi
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 60 > /dev/null || true
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion
          }
          ci="$(ci_on catalog-follow "$SHA")"
          if [ "$ci" != success ]; then
            echo "::warning::ci.yml on the followed catalog is $ci; #$PR stays open, tomorrow retries"
            exit 0
          fi
          # A merge commit keeps the github-actions[bot] commit the release gate looks for.
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"; then
            echo "::warning::#$PR did not merge; it stays open, tomorrow retries"
            exit 0
          fi
          merged="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
          echo "ci.yml on merge commit $merged: $(ci_on master "$merged")"
          echo "Merged #$PR as \`$merged\`" >> "$GITHUB_STEP_SUMMARY"

      # The release is cut from master as it is now, with the followed catalog in it.
      - name: Update to master
        if: steps.follow.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" master
          git checkout -q --detach FETCH_HEAD

      - name: Decide the next release
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          line="$(tr -d '[:space:]' < internal/appversion/VERSION)"
          head="$(git rev-parse HEAD)"
          # A failed lookup must stop here: an empty list would read as "never released".
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          latest="$(printf '%s\n' "$tags" | grep -E "^v${line//./\\.}(\.[1-9][0-9]*)?\$" | sort -V | tail -n1 || true)"
          if [ -z "$latest" ]; then
            echo "::notice::v$line has not been released; publish it by hand first"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$latest" "$head"; then
            echo "::error::$latest is not an ancestor of master" >&2
            exit 1
          fi
          if [ -z "$(git rev-list "$latest..$head")" ]; then
            echo "nothing on master since $latest"
            exit 0
          fi
          # A followed Ky app counts like a Dependabot change.
          if [ "$EVENT" = schedule ] && [ -z "$(git log --format=%H --author='^dependabot\[bot\]' "$latest..$head")" ] &&
            [ -z "$(git log --format=%H --author='^github-actions\[bot\]' --grep='^catalog: follow ' "$latest..$head")" ]; then
            echo "no Dependabot or catalog-follow changes since $latest"
            exit 0
          fi

          # The image build refuses a commit whose CI did not pass; refuse it here
          # too, so a red day leaves no release without an image. Tomorrow retries.
          # The newest run counts, pushed or dispatched (a catalog-follow commit's).
          ci="$(gh run list --workflow ci.yml --branch master --commit "$head" \
            --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')"
          if [ "$ci" != "completed/success" ]; then
            echo "::warning::CI on $head is ${ci:-absent}, not completed/success; not releasing"
            exit 0
          fi

          n="${latest#"v$line"}"
          next="v$line.$(( ${n#.} + 1 ))"
          echo "releasing $next at $head (previous $latest)"
          printf 'tag=%s\nprevious=%s\nsha=%s\n' "$next" "$latest" "$head" >> "$GITHUB_OUTPUT"

      # A release made with GITHUB_TOKEN raises no release event, so the image
      # workflow is dispatched on the new tag (the image's and the binaries'
      # attestation identity stays release-image.yml@refs/tags/<tag>).
      - name: Publish the release and its image
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
          SHA: ${{ steps.next.outputs.sha }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" -f previous_tag_name="$PREVIOUS" --jq ' .body // ""' > "$notes"
          python3 scripts/check-release-notes.py "$notes"
          printf '\nUpgrade: verify the matching installer and runner image before use; review existing plans before applying a changed catalog. See https://github.com/Busnes-app/KyQuickStart/blob/%s/docs/VERIFYING-RELEASES.md and https://github.com/Busnes-app/KyQuickStart/blob/%s/docs/guided-setup.md.\n' "$TAG" "$TAG" >> "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" \
            --notes-file "$notes" --latest
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Released \`$TAG\` at \`$SHA\`; release-image.yml dispatched on it" >> "$GITHUB_STEP_SUMMARY"
