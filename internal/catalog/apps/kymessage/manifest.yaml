name: kymessage
description: KyMessages, the suite's chat and calls (Matrix, Element, LiveKit); signs in through KyIdentity
category: ky
version: 0.4.5
# kymessage: release image of v0.4.4 (commit b0f2001e3d3fd80093e6b2f5bd341168dc7517dd), attested by
# Busnes-app/KyMessage-Server release-image.yml@refs/tags/v0.4.4 (gh attestation verify; the
# attested gitCommit is v0.4.4^{commit}).
# The other five are the stock upstream images KyMessage's docker-compose.matrix.yml pins, by
# tag and digest in v0.4.4 (unchanged since v0.4.3); no attestation was found for them
# (provenance: KyMessage's compose).
# catalog-follow: v0.4.5 attested by Busnes-app/KyMessage-Server release-image.yml@refs/tags/v0.4.5
images:
  kymessage: ghcr.io/busnes-app/kymessage-server:0.4.5@sha256:e8f95f8a293f21df28d5c06b40df63be1bd87eb3aee44d86b410600cb6edd9c2
  postgres: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  synapse: ghcr.io/element-hq/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
  mas: ghcr.io/element-hq/matrix-authentication-service:1.26.0@sha256:e089f1048a1d4a9a492ed17b9fe759100f1bd619407b001f5927928d88b780c4
  element: ghcr.io/element-hq/element-web:v1.12.30@sha256:3e7dbd4424de9e11c812bc740acf2725b2abe66ea0d0802023b56fd85d3fa09a
  livekit: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
# Generated on the target. KY_SESSION_SECRET has no file form; the console's entrypoint reads it.
# matrix-init writes the Matrix stack's own secrets under matrix/secrets.
secrets: [session_secret]
# verify-edge reads the suite proxy contract here (clientIp, proxyHeadersTrusted, scheme).
status_path: /api/installer/network
# Its setup and MAS need KyIdentity's issuer and two clients.
depends_on: [kyidentity]
health:
  # Synapse waits for Postgres and MAS; Element for Synapse.
  timeout_seconds: 600
# The console's client: its setup creates the owner's admin and everyday accounts, and the
# signed directory webhook carries offboarding to the console's sweep, which locks the person in
# MAS and ends their chat sessions. No SCIM, no automatic provisioning. KyIdentity registers no
# back-channel logout, so a KyIdentity sign-out leaves chat sessions in place.
oidc:
  name: KyMessages
  redirect_paths: [/api/sso/kyidentity/callback]
  admin_role: kymessage.admin
  user_role: kymessage.user
  directory_path: /api/sso/kyidentity/sync
# MAS's upstream provider: everyday accounts only, so the dedicated admin has no chat. MAS takes
# the Matrix localpart from a verified email's local part.
chat_oidc:
  name: KyMessages chat
  role: auth
  client_suffix: chat
  everyday_role: kymessage.chat
  redirect_path: /upstream/callback/{provider_id}
# One hostname per role; the console is the primary. The server name serves only Matrix's
# delegation files (the server file answers only while federation is open); the edge closes
# Synapse's admin and MAS APIs and LiveKit's server API.
routes:
  - {role: console, service: app, port: 8080}
  - {role: server_name, service: app, port: 8080, paths: [/.well-known/matrix/client, /.well-known/matrix/server]}
  - {role: matrix, service: synapse, port: 8008, deny_paths: ["^/_synapse/(admin|mas)/"]}
  - {role: auth, service: mas, port: 8080}
  - {role: chat, service: element, port: 8080}
  - {role: rtc, service: livekit, port: 7880, deny_paths: ["^/twirp/"]}
# Call media goes straight to LiveKit on media_address, never through the edge. No TURN.
media:
  ports: [7881/tcp, 7882/udp]
# The console's SQLite database, its sealed capsules, matrix-init's configuration and secrets
# (signing key included) and Synapse's media, plus Postgres as a dump: its data directory
# (pgdata) is not backed up raw.
backup:
  service: postgres
  command: [pg_dumpall, -U, postgres, --clean, --if-exists]
  # Into the fresh cluster init.sql made: pg_dumpall --clean drops and creates every role,
  # including the superuser restoring it, which Postgres refuses ("current user cannot be
  # dropped"); its ALTER ROLE still restores that role's password.
  restore_command: [sh, -c, "sed -e '/^DROP ROLE IF EXISTS postgres;$/d' -e '/^CREATE ROLE postgres;$/d' | psql -X -q -o /dev/null -v ON_ERROR_STOP=1 -U postgres -d postgres"]
  volumes: [data, backups, matrix, media]
  # The console's session secret; the hot copy of data carries the directory secret.
  capsule_secrets: [session_secret]
  restore_order: [postgres, mas, app, synapse, element, livekit]
  # KyIdentity's removals reach the console, whose sweep ends sessions in MAS, before Synapse
  # starts: a restored session of someone removed later has no homeserver to use until then.
  replay_after: app
upgrade:
  # 0.4.3 to 0.4.4 changes no schema: no console migration, the same five stock images, and
  # matrix-init's inputs are unchanged, so it does not rerun.
  min_from: 0.4.3
  migrates_data: false
