name: kyyard
description: KyYard, the suite's fleet administration; runs the suite runner beside it
category: ky
version: 0.5.0.2
# Release image of v0.4.3 (commit 0bf5e1cb43dcc50ec8ecf2a80edc7b0373050050), attested by
# Busnes-app/KyYard-server release-image.yml@refs/tags/v0.4.3 (gh attestation verify; the
# certificate names KyYard-server, so that spelling is the one that verifies).
# catalog-follow: v0.5.0.2 attested by Busnes-app/KyYard-server release-image.yml@refs/tags/v0.5.0.2
images:
  kyyard: ghcr.io/busnes-app/kyyard:0.5.0.2@sha256:534e0b2c58e6b25516e67d51f70d55ac1c4d72c404a9c273b5b197ebfd954bee
# verify-edge reads the suite proxy contract here (clientIp, proxyHeadersTrusted, scheme).
status_path: /api/installer/network
# Manages the suite's installation: administrators only, never on the public connection.
exposure: internal
# Its setup needs KyIdentity's issuer, client and signed directory.
depends_on: [kyidentity]
health:
  timeout_seconds: 300
# Admin-only: fleet administration has no everyday workflow, so KyIdentity assigns only the
# owner's admin account and refuses everyone else. No SCIM (KyYard answers 404) and no
# automatic provisioning: only the identity its setup creates signs in. Sign-out is local.
oidc:
  name: KyYard
  redirect_paths: [/api/sso/kyidentity/callback]
  admin_role: kyyard.admin
  directory_path: /api/installer/directory
# The SQLite database with its generated session and encryption keys, and the sealed local
# capsules under /data/backups. The runner's state is not here: handoff recreates it.
backup:
  volumes: [data]
upgrade:
  # 0.5.0 adds migration 46 at startup (back-channel logout); additive. 0.4.2 reads no
  # KyIdentity roles, so 0.4.3 stays the floor.
  min_from: 0.4.3
  migrates_data: true
  note: >-
    Signs out single sign-on users and linked local accounts once, at first start, and cancels
    pending MFA challenges; people sign in again.
kubernetes:
  image: kyyard
  env:
    KY_BACKUP_ALLOW_PRIVATE_RECOVERY: "{{private_recovery}}"
    KY_HOST: 0.0.0.0
    KY_PORT: "9273"
    # Ingress is limited to the edge's pods by NetworkPolicy.
    KY_ALLOW_PLAINTEXT_BIND: "true"
    # KyYard refuses HTTPS without a trusted proxy. Only this pod's own processes connect over
    # loopback, so the edge's forwarded headers stay untrusted and no client can spoof its address.
    KY_TRUSTED_PROXIES: 127.0.0.1
    KY_APP_NAME: KyYard
    # Its setup requires the callback to be this plus /api/sso/kyidentity/callback.
    KY_APP_URL: https://{{host}}
    KY_DB_DRIVER: sqlite
    KY_DATA_DIR: /data
    # Empty disables the local Docker connection: a pod has no Docker socket.
    KY_DOCKER_SOCKET: ""
    # The image enrolled agents run. KyYard finds its own digest only through a Docker
    # socket, so without this it cannot generate an enrollment command.
    KY_AGENT_IMAGE: "{{pinned_image:kyyard}}"
    # Setup refuses either enabled.
    KY_SSO_ENABLED: "false"
    KY_SCIM_ENABLED: "false"
    KY_BACKUP_DIR: /data/backups
    KY_BACKUP_KEEP: "7"
    KY_BACKUP_DEPOSIT_INTERVAL: 24h
    # The runner's socket, for KyYard's Suite page.
    KY_SUITE_RUNNER_SOCKET: /run/kyquickstart/sock/runner.sock
    GOMEMLIMIT: 384MiB
  ports: [9273]
  readiness_path: /health/ready
  # The image's kyyard user, which the runner sidecar shares.
  run_as: 10001
  resources:
    cpu: "1"
    # Idle between requests.
    cpu_request: 50m
    memory: 512Mi
  # Stop drains HTTP (5 s) and a backup deposit already on the wire (17 min).
  termination_grace_seconds: 1200
  volumes:
    - name: data
      mount: /data
      size: 10Gi
  suite_runner: true
